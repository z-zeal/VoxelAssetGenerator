<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voxel Asset Preview — Select by Type / Name / Direction / Frame</title>
<style>
:root{--bg:#0c0e13;--surface:#13151e;--surface-2:#181b26;--line:#23293a;--text:#e2e8f0;--muted:#8a95a8;--accent:#e8c46a;--accent-2:#7ecfff;--font:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
header{padding:18px 24px;border-bottom:1px solid var(--line);background:rgba(12,14,19,.95);backdrop-filter:blur(12px);position:sticky;top:0;z-index:10}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.03em;font-weight:780}
p.subtitle{margin:0;color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:260px 1fr;gap:0;min-height:calc(100vh - 80px)}
@media(max-width:950px){.layout{grid-template-columns:1fr}}
.sidebar{background:var(--surface);border-right:1px solid var(--line);padding:14px;overflow-y:auto;max-height:calc(100vh - 80px);position:sticky;top:80px}
.sidebar h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.sidebar button{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 10px;margin:2px 0;color:var(--text);cursor:pointer;font-size:13px;transition:.1s}
.sidebar button:hover{background:var(--surface-2);border-color:var(--line)}
.sidebar button.active{background:linear-gradient(135deg,#1b1e2a,#161a23);border-color:var(--accent);color:var(--text);font-weight:600}
.asset-list{font-size:12px;color:#b0b8c8;max-height:200px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:6px;background:#0e1118}
.asset-list button{padding:4px 8px;font-size:12px;border-radius:6px}
.main{padding:22px 26px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input{flex:1;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 14px;color:var(--text);font:inherit;outline:none}
.toolbar input:focus{border-color:var(--accent-2)}
.preview-box{background:linear-gradient(135deg,#11131a,#0c0e15);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:320px;position:relative}
.preview-box img{max-height:70vh;max-width:100%;object-fit:contain;image-rendering:pixelated}
.preview-meta{margin-top:10px;font-size:12px;color:var(--muted)}
.directions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:center}
.dir-btn{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--text);cursor:pointer;transition:.15s}
.dir-btn.active{background:var(--accent);color:#0c0e13;border-color:var(--accent);font-weight:600}
.dir-btn:hover{border-color:var(--accent-2)}
.animation{margin-top:16px;display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
.animation input[type=range]{flex:1;min-width:180px}
.animation button{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);cursor:pointer;font-size:12px}
.animation button:hover{border-color:var(--accent-2)}
.animation .frame-label{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:90px}
.sheet-strip{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.sheet-strip img{height:80px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#11141a}
</style>
</head>
<body>
<header>
  <h1>Voxel Asset Preview</h1>
  <p class="subtitle">Select category → asset → direction → frame. All rendered from source models.</p>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search assets or filenames…" aria-label="Search">
    <button onclick="setCategory('Unit')">Unit</button>
    <button onclick="setCategory('Building')">Building</button>
    <button onclick="setCategory('Terrain')">Terrain</button>
    <button onclick="setCategory('All')">All</button>
  </div>
</header>
<div class="layout">
  <aside class="sidebar">
    <h3>Category</h3>
    <div id="catButtons"></div>
    <h3>Asset names</h3>
    <div class="asset-list" id="assetList"></div>
  </aside>
  <main class="main">
    <div class="preview-box" id="previewWrap">
      <img id="mainImg" src="game_assets/voxels/infantry.png" alt="preview">
      <div class="preview-meta" id="previewMeta">infantry · preview (right)</div>
    </div>
    <div class="directions" id="dirRow"></div>
    <div class="animation">
      <button onclick="playAnimation()">▶ Play</button>
      <button onclick="pauseAnimation()">⏸ Pause</button>
      <input id="frameRange" type="range" min="0" max="5" value="0" step="1" oninput="setFrame(this.value)" aria-label="Animation frame">
      <span class="frame-label" id="frameLabel">frame 0 / 5</span>
    </div>
    <div class="sheet-strip" id="sheetStrip"></div>
  </main>
</div>
<script>
let DATA = { byCategory: {Unit:[], Building:[], Terrain:[]}, previews: [], sheets: [] };
let currentAsset = 'infantry';
let currentDir = 'right';
let currentFrame = 0;
let playing = false;
let playTimer = null;

async function loadData() {
  try {
    const r = await fetch('assets-list-full.json');
    if (r.ok) DATA = await r.json();
  } catch (e) { console.warn('assets-list-full.json not loaded'); }
  renderCategories();
  renderAssets();
  renderDirRow();
  renderStrip();
}

function renderCategories() {
  const box = document.getElementById('catButtons');
  box.innerHTML = '';
  for (const cat of ['Unit','Building','Terrain','All']) {
    const b = document.createElement('button');
    b.textContent = cat;
    b.onclick = () => setCategory(cat);
    b.className = (cat==='Unit') ? 'active' : '';
    box.appendChild(b);
  }
}

function setCategory(cat) {
  document.querySelectorAll('#catButtons button').forEach(b=>b.classList.toggle('active', b.textContent===cat));
  renderAssets();
  const catKey = cat.toLowerCase();
  const list = DATA.byCategory[catKey] || (cat==='All' ? (DATA.byCategory.unit||[]).concat(DATA.byCategory.building||[]).concat(DATA.byCategory.terrain||[]) : []);
  if (list.length) { currentAsset = list[0]; renderAll(); }
}

function renderAssets() {
  const search = (document.getElementById('search').value||'').toLowerCase();
  const activeCatBtn = document.querySelector('#catButtons button.active');
  const activeCat = activeCatBtn ? activeCatBtn.textContent.trim() : 'Unit';
  let list = [];
  if (activeCat === 'All') {
    list = (DATA.byCategory.unit||[]).concat(DATA.byCategory.building||[]).concat(DATA.byCategory.terrain||[]);
  } else {
    list = DATA.byCategory[activeCat.toLowerCase()] || [];
  }
  if (search) list = list.filter(a => a.toLowerCase().includes(search));
  const box = document.getElementById('assetList');
  box.innerHTML = '';
  for (const a of list) {
    const b = document.createElement('button');
    b.textContent = a;
    b.onclick = () => { currentAsset = a; renderAll(); };
    b.className = (a === currentAsset) ? 'active' : '';
    box.appendChild(b);
  }
}

function renderDirRow() {
  const dirs = [
    ['up', 'up (N ↗)'],
    ['up-right', 'up-right (NE →)'],
    ['right', 'right (E ↘)'],
    ['down-right', 'down-right (SE ↓)'],
    ['down', 'down (S ↙)'],
    ['down-left', 'down-left (SW ←)'],
    ['left', 'left (W ↖)'],
    ['up-left', 'up-left (NW ↑)'],
  ];
  const row = document.getElementById('dirRow');
  row.innerHTML = '';
  for (const [d, label] of dirs) {
    const b = document.createElement('button');
    b.className = 'dir-btn' + (d===currentDir?' active':'');
    b.textContent = label;
    b.onclick = () => { currentDir = d; currentFrame = 0; renderAll(); };
    row.appendChild(b);
  }
}

function renderStrip() {
  const strip = document.getElementById('sheetStrip');
  strip.innerHTML = '';
  const base = currentAsset;
  let allSheets = (DATA.sheetsByAsset && DATA.sheetsByAsset[base]) ? DATA.sheetsByAsset[base] : [];
  let sheets = allSheets.filter(s => s.includes('-' + currentDir + '-'));
  if (!sheets.length) sheets = allSheets;
  for (const s of sheets.slice(0, 8)) {
    const img = document.createElement('img');
    let src = s;
    if (!src.startsWith('game_assets')) src = 'game_assets/voxels/sheets/'+s.split('/').pop();
    img.src = src;
    img.alt = s;
    img.style.height = '70px';
    img.style.objectFit = 'contain';
    img.style.border = '1px solid #222';
    img.style.borderRadius = '6px';
    strip.appendChild(img);
  }
}

function renderAll() {
  const candidates = [
    'game_assets/voxels/sheets/' + currentAsset + '-' + currentDir + '-0.png',
    'game_assets/voxels/sheets/' + currentAsset + '-' + currentDir + '-n.png',
    'game_assets/voxels/' + currentAsset + '.png'
  ];
  let idx = 0;
  const mainImg = document.getElementById('mainImg');
  mainImg.onerror = function() {
    idx++;
    if (idx < candidates.length) this.src = candidates[idx];
  };
  mainImg.src = candidates[0];
  document.getElementById('previewMeta').textContent = currentAsset + ' · ' + currentDir + ' · frame ' + currentFrame;
  renderDirRow();
  renderStrip();
}

function setFrame(v) {
  currentFrame = parseInt(v);
  document.getElementById('frameLabel').textContent = 'frame ' + currentFrame + ' / 5';
  document.getElementById('frameRange').value = currentFrame;
  document.getElementById('previewMeta').textContent = currentAsset + ' · preview (' + currentDir + ') · frame ' + currentFrame;
}
function playAnimation() {
  playing = true;
  playTimer = setInterval(() => {
    let max = 5;
    currentFrame = (currentFrame + 1) % (max + 1);
    document.getElementById('frameRange').value = currentFrame;
    document.getElementById('frameLabel').textContent = 'frame ' + currentFrame + ' / ' + max;
  }, 300);
}
function pauseAnimation() {
  playing = false;
  clearInterval(playTimer);
}

document.getElementById('search').addEventListener('input', () => { renderAssets(); renderAll(); });

loadData().then(() => { setCategory('Unit'); });
</script>
</body>
</html>
